<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Optimizer - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex">

<!-- Left Sidebar Menu -->
<aside class="w-64 bg-slate-900 text-white flex flex-col justify-between p-6 min-h-screen flex-shrink-0">
    <div>
        <!-- Sidebar Title -->
        <h1 class="text-xl font-bold mb-8 tracking-tight text-white flex items-center gap-2">
            <i class="fa-solid fa-hospital text-teal-400"></i> Queue Optimizer
        </h1>

        <!-- Navigation Links -->
        <nav class="space-y-3">
            <a href="#" class="flex items-center gap-3 bg-teal-700 text-white font-medium px-4 py-3 rounded-lg shadow-sm">
                <i class="fa-solid fa-user-shield text-sm"></i>
                <span>Admin View</span>
            </a>
            <button onclick="logout()" class="w-full text-left flex items-center gap-3 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-700 px-4 py-3 rounded-lg transition font-medium">
                <i class="fa-solid fa-right-from-bracket text-sm"></i>
                <span>Log out</span>
            </button>
        </nav>
    </div>

    <div class="text-xs text-slate-500">
        CareFlow Health Systems &bull; v2.0
    </div>
</aside>

<!-- Main Content Area -->
<main class="flex-grow p-10 overflow-y-auto">

    <!-- Top Header Status Bar -->
    <header class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-bold text-slate-900">Admin Control Panel</h2>
        <div id="status-badge" class="flex items-center gap-2 text-xs font-semibold bg-white border border-slate-200 px-3 py-1.5 rounded-full text-emerald-600 shadow-sm">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>System Connected</span>
        </div>
    </header>

    <div class="max-w-4xl space-y-8">

        <!-- Card 1: Add a Department -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
            <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-building-columns text-teal-700"></i> Add a department
            </h3>
            <form onsubmit="handleAddDepartment(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Name</label>
                    <input type="text" id="dept-name" required placeholder="e.g. Cardiology"
                           class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-600 focus:outline-none text-sm">
                </div>
                <div>
                    <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-2.5 rounded-lg transition text-sm shadow">
                        Add department
                    </button>
                </div>
            </form>
            <div id="dept-msg" class="mt-4 text-xs font-medium hidden"></div>
        </section>


        <!-- Card 2: Add a Doctor -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
            <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-user-doctor text-teal-700"></i> Add a doctor
            </h3>
            <form onsubmit="handleAddDoctor(event)" class="space-y-5">

                <!-- Row 1: Doctor Name & Department -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Doctor Name</label>
                        <input type="text" id="doc-name" required placeholder="e.g. Dr. Mehta"
                               class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-600 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Department</label>
                        <select id="doc-dept" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-600 focus:outline-none text-sm bg-white">
                            <option value="" disabled selected>Select a department</option>
                            <!-- Dynamically populated from /api/departments -->
                        </select>
                    </div>
                </div>

                <!-- Row 2: Qualification & Experience -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Qualification</label>
                        <input type="text" id="doc-qual" required placeholder="e.g. MBBS, MD (Cardiology)"
                               class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-600 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Experience (Years)</label>
                        <input type="number" id="doc-exp" min="0" required placeholder="10"
                               class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-600 focus:outline-none text-sm">
                    </div>
                </div>

                <!-- Row 3: Visiting Days -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Visiting Days</label>
                    <select id="doc-days" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-600 focus:outline-none text-sm bg-white">
                        <option value="Monday - Saturday">Monday - Saturday</option>
                        <option value="Monday - Friday">Monday - Friday</option>
                        <option value="Weekends Only">Weekends Only</option>
                    </select>
                </div>

                <!-- Row 4: Time Slots -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Time Slots</label>
                    <select id="doc-slots" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-600 focus:outline-none text-sm bg-white">
                        <option value="Mon-Fri: 9 AM - 1 PM, 3 PM - 8 PM | Sat: 9 AM - 1 PM">Mon-Fri: 9 AM - 1 PM, 3 PM - 8 PM | Sat: 9 AM - 1 PM</option>
                        <option value="Mon-Fri: 10 AM - 4 PM">Mon-Fri: 10 AM - 4 PM</option>
                        <option value="Mon-Sat: 8 AM - 2 PM">Mon-Sat: 8 AM - 2 PM</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-2.5 rounded-lg transition text-sm shadow">
                        Add Doctor
                    </button>
                </div>
            </form>
            <div id="doc-msg" class="mt-4 text-xs font-medium hidden"></div>
        </section>

    </div>
</main>

<!-- JavaScript Handlers -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetchDepartments();
    });

    // Load existing departments into dropdown
    async function fetchDepartments() {
        try {
            const res = await fetch('/api/departments');
            if (res.ok) {
                const depts = await res.json();
                const select = document.getElementById('doc-dept');
                select.innerHTML = '<option value="" disabled selected>Select a department</option>';
                depts.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    select.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Error loading departments:", err);
        }
    }

    // Handle Add Department Form
    async function handleAddDepartment(e) {
        e.preventDefault();
        const name = document.getElementById('dept-name').value;
        const msg = document.getElementById('dept-msg');

        try {
            const res = await fetch('/api/departments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            });

            if (res.ok) {
                msg.textContent = "Department added successfully!";
                msg.className = "mt-4 text-xs font-medium text-emerald-600 block";
                document.getElementById('dept-name').value = '';
                fetchDepartments(); // Refresh dropdown list
            } else {
                msg.textContent = "Failed to add department.";
                msg.className = "mt-4 text-xs font-medium text-rose-500 block";
            }
        } catch (err) {
            msg.textContent = "Error connecting to server.";
            msg.className = "mt-4 text-xs font-medium text-rose-500 block";
        }
    }

    // Handle Add Doctor Form
    async function handleAddDoctor(e) {
        e.preventDefault();
        const msg = document.getElementById('doc-msg');

        const doctorData = {
            name: document.getElementById('doc-name').value,
            departmentId: document.getElementById('doc-dept').value,
            qualification: document.getElementById('doc-qual').value,
            experienceYears: document.getElementById('doc-exp').value,
            visitingDays: document.getElementById('doc-days').value,
            timeSlots: document.getElementById('doc-slots').value
        };

        try {
            const res = await fetch('/api/doctors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(doctorData)
            });

            if (res.ok) {
                msg.textContent = "Doctor profile created successfully!";
                msg.className = "mt-4 text-xs font-medium text-emerald-600 block";
                e.target.reset();
            } else {
                msg.textContent = "Failed to register doctor.";
                msg.className = "mt-4 text-xs font-medium text-rose-500 block";
            }
        } catch (err) {
            msg.textContent = "Error submitting doctor data.";
            msg.className = "mt-4 text-xs font-medium text-rose-500 block";
        }
    }

    function logout() {
        window.location.href = './index.html';
    }
</script>
</body>
</html>
